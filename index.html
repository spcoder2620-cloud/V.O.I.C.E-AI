<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V.O.I.C.E. — Terminal</title>

<style>
    :root {
        --bg: #000;
        --text: #d6d6d6;
        --dim: #8b8b8b;
        --green: #66ff66;
        --cyan: #7cc7ff;
        --red: #ff5f57;
        --yellow: #febc2e;
        --green-dot: #28c840;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Menlo, Monaco, "Courier New", monospace;
    }

    body {
        overflow: hidden;
    }

    .terminal {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #000;
    }

    .titlebar {
        height: 28px;
        flex: 0 0 28px;
        display: flex;
        align-items: center;
        position: relative;
        background: linear-gradient(#3a3a3a, #262626);
        border-bottom: 1px solid #111;
        user-select: none;
    }

    .traffic {
        display: flex;
        gap: 7px;
        margin-left: 9px;
    }

    .traffic span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
    }

    .red { background: var(--red); }
    .yellow { background: var(--yellow); }
    .green-dot { background: var(--green-dot); }

    .title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: #cfcfcf;
        font-size: 12px;
    }

    .screen {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px 18px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        cursor: text;
    }

    .screen::-webkit-scrollbar {
        width: 10px;
    }

    .screen::-webkit-scrollbar-track {
        background: #050505;
    }

    .screen::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 8px;
    }

    .line {
        margin-bottom: 7px;
    }

    .system { color: var(--dim); }
    .research { color: #696969; }
    .prompt { color: var(--green); }
    .reply { color: var(--text); }
    .heading { color: var(--cyan); }
    .error { color: #ff6464; }

    .inputrow {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        padding: 0 14px 14px;
        background: #000;
    }

    .prompttext {
        color: var(--green);
        margin-right: 8px;
        white-space: nowrap;
    }

    #input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        caret-color: #fff;
        font: inherit;
        padding: 0;
    }

    #input:disabled {
        opacity: .65;
    }

    @media (max-width: 600px) {
        body { font-size: 13px; }
        .screen { padding: 10px; }
        .inputrow { padding: 0 10px 10px; }
        .title { font-size: 11px; }
    }
</style>
</head>

<body>
<div class="terminal" id="terminal">

    <div class="titlebar">
        <div class="traffic">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green-dot"></span>
        </div>
        <div class="title">V.O.I.C.E. — Terminal</div>
    </div>

    <div class="screen" id="screen">
        <div class="line heading">V . O . I . C . E .</div>
        <div class="line system">BRAIN ........ ONLINE</div>
        <div class="line system">MEMORY ....... ONLINE</div>
        <div class="line system">NETWORK ...... READY</div>
        <div class="line system">WEB .......... READY</div>
        <div class="line"></div>
        <div class="line system">Ask anything.</div>
        <div class="line system">The Python brain handles research, memory and answers.</div>
        <div class="line"></div>
    </div>

    <form class="inputrow" id="form">
        <span class="prompttext">@you:~ %</span>
        <input id="input" autocomplete="off" spellcheck="false" autofocus>
    </form>

</div>

<script>
/*
    ============================================================
    PUT YOUR PUBLIC PYTHON BACKEND URL HERE
    ============================================================

    Example:
        const BACKEND_URL =
            "https://your-python-server.example/chat";

    For local testing:
        const BACKEND_URL =
            "http://127.0.0.1:8765/chat";
*/
const BACKEND_URL = "https://v-o-i-c-e-ai.onrender.com/chat";

const screen = document.getElementById("screen");
const form = document.getElementById("form");
const input = document.getElementById("input");
const terminal = document.getElementById("terminal");

function line(text, className) {
    const div = document.createElement("div");
    div.className = "line " + (className || "system");
    div.textContent = text;
    screen.appendChild(div);
    screen.scrollTop = screen.scrollHeight;
}

function block(text, className) {
    String(text || "")
        .split("\n")
        .forEach(part => line(part, className));
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = input.value.trim();

    if (!message || input.disabled) {
        return;
    }

    line("@you:~ % " + message, "prompt");
    input.value = "";

    if (["quit", "exit", "shutdown"].includes(message.toLowerCase())) {
        line("");
        block('"Session closed."', "reply");
        return;
    }

    if (
        !BACKEND_URL ||
        BACKEND_URL === "PUT_YOUR_PYTHON_BACKEND_URL_HERE"
    ) {
        line("");
        block(
            "ERROR: Python backend URL has not been configured.",
            "error"
        );
        line(
            "Open index.html and set BACKEND_URL to your public Python /chat URL.",
            "error"
        );
        line("");
        return;
    }

    input.disabled = true;

    line("> contacting V.O.I.C.E. Python backend...", "research");

    try {
        const response = await fetch(BACKEND_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            throw new Error(
                data.error || "Python backend returned an error."
            );
        }

        if (data.research) {
            line("");
            block(data.research, "research");
        }

        if (data.reply) {
            line("");
            block("V.O.I.C.E.:", "heading");
            block(data.reply, "reply");
        }

        line("");

    } catch (error) {
        line("");
        block(
            "ERROR: " + error.message,
            "error"
        );
        line("");
    } finally {
        input.disabled = false;
        input.focus();
    }
});

terminal.addEventListener("click", () => input.focus());
</script>

</body>
</html>
