<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V.O.I.C.E.</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#d7d7d7;font-family:Menlo,Monaco,"Courier New",monospace;font-size:14px}
*{box-sizing:border-box}
body{overflow:hidden}
#terminal{height:100%;display:flex;flex-direction:column;background:#000}
.titlebar{height:28px;flex:0 0 28px;display:flex;align-items:center;position:relative;background:linear-gradient(#3b3b3b,#252525);border-bottom:1px solid #111;user-select:none}
.traffic{display:flex;gap:7px;margin-left:9px}.traffic i{width:11px;height:11px;border-radius:50%;display:block}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.title{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:#cfcfcf}
#screen{flex:1;overflow:auto;padding:11px 14px 18px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
#screen::-webkit-scrollbar{width:10px}#screen::-webkit-scrollbar-track{background:#050505}#screen::-webkit-scrollbar-thumb{background:#222}
.line{margin:0 0 7px}.system{color:#929292}.research{color:#666}.prompt{color:#6dfc78}.reply{color:#d7d7d7}.heading{color:#82c7ff}.error{color:#ff6a6a}
.inputrow{display:flex;align-items:center;flex:0 0 auto;padding:0 14px 14px}
.prompttext{color:#6dfc78;margin-right:8px;white-space:nowrap}
#input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#d7d7d7;caret-color:#fff;font:inherit;padding:0}
#input:disabled{opacity:.6}
@media(max-width:600px){body{font-size:13px}.title{font-size:11px}.inputrow{padding:0 10px 10px}#screen{padding:10px}}
</style>
</head>
<body>
<div id="terminal">
  <div class="titlebar">
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="title">Terminal</div>
  </div>
  <div id="screen">
    <div class="line heading">V . O . I . C . E .</div>
    <div class="line system">Type a question, or paste a YouTube link and I will learn from it.</div>
    <div class="line"></div>
  </div>
  <form class="inputrow" id="form">
    <span class="prompttext">@you:~ %</span>
    <input id="input" autofocus autocomplete="off" spellcheck="false">
  </form>
</div>
<script>
const BACKEND_URL = "https://v-o-i-c-e-ai.onrender.com/chat";
const screen=document.getElementById("screen"),form=document.getElementById("form"),input=document.getElementById("input");
function addLine(text,cls){const el=document.createElement("div");el.className="line "+(cls||"system");el.textContent=text;screen.appendChild(el);screen.scrollTop=screen.scrollHeight}
function addBlock(text,cls){String(text||"").split("\n").forEach(x=>addLine(x,cls))}
form.addEventListener("submit",async e=>{
 e.preventDefault(); const message=input.value.trim(); if(!message||input.disabled)return;
 addLine("@you:~ % "+message,"prompt"); input.value="";
 if(["quit","exit","shutdown"].includes(message.toLowerCase())){addLine("");addBlock('"Session closed."',"reply");return}
 input.disabled=true; addLine("> thinking...","research");
 try{
  const r=await fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
  const data=await r.json(); if(!r.ok||data.error)throw new Error(data.error||"Backend error");
  if(data.research){addLine("");addBlock(data.research,"research")}
  if(data.reply){addLine("");addLine("V.O.I.C.E.:","heading");addBlock(data.reply,"reply")}
  addLine("");
 }catch(err){addLine("");addLine("ERROR: "+err.message,"error");addLine("")}
 finally{input.disabled=false;input.focus()}
});
document.getElementById("terminal").addEventListener("click",()=>input.focus());
</script>
</body>
</html>
